# Docker's json-file log driver keeps every line of a container forever unless told otherwise, so each service rotates its own
# log (three files of 20 MB) instead of filling the host disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:v1.102.2
    container_name: libs-proxy-tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_VM_AUTH_KEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: libs-proxy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  app:
    # Built in CI (repo-root context); deployed via vm-ops-api /services/libs-proxy/redeploy.
    image: docker.io/${IMAGE_NAMESPACE:-nuesslerm}/libs-proxy:${IMAGE_TAG:-latest}
    container_name: libs-proxy
    # Tailnet only, no published port: the read link it holds never leaves the VM, and the tailnet ACL is the authorization.
    network_mode: service:tailscale
    environment:
      PORT: ${PORT:-8793}
      # The read link of the private `libs/` prefix (a secret from `sync-env --for libs-proxy`), and the tailnet URL the index
      # and the lockfiles name for this service (committed in .env.defaults).
      LIBS_READ_PAR_URL: ${LIBS_READ_PAR_URL:-}
      LIBS_PROXY_BASE_URL: ${LIBS_PROXY_BASE_URL:-}
    healthcheck:
      test: ["CMD", "libs-proxy-rs", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - tailscale
    restart: unless-stopped
    logging: *logging

volumes:
  tailscale-state:
