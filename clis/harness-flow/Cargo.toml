[package]
name = "harness-flow"
version = "0.1.0"
edition = "2021"
publish = false
description = "The flow harness: `wf flow run` (vitest over the app's flow tests) and `wf flow goldens`, and the headless Chromium that paints a frozen flow DOM and that `wf check --visual` drives"

[lib]
doctest = false

[[bin]]
name = "harness-flow"
path = "src/bin/harness-flow.rs"
test = false

[dependencies]
harness-core = { path = "../harness-core" }
wf-kit = { path = "../wf-kit" }
cdp = { path = "../cdp" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
wf-testkit = { path = "../wf-testkit" }
