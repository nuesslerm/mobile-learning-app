# R1: every phone row of t3-methods.json answered by the real pinned T3 server (the release the pin names), recorded on the VM. Inputs: `node tooling/mimic-drivers/src/cli.ts corpus t3 <this dir>`.
rules = "rules.json"
corpus = "corpus.json"
allowlist = "allowlist.json"
provision_file = "//tooling/mimic-drivers/provision/t3.toml"

[diff]
ignore_dirs = ["c2s"]
breaking_paths = ["steps.http:ret:_.payload.status", "steps.ws:open:s2c:_.payload.status"]
advertised_prefixes = ["capabilities."]

[diff.fold]
channel = "ws"
tag = "/_tag"
chunk = "Chunk"
values = "/values"
once = [["/kind", "snapshot"]]
squash = ["/exit/cause"]

[reference]
name = "t3"
command = ["node", "../../../../tooling/mimic-drivers/src/cli.ts", "serve", "t3"]
pin = "../../../../tooling/t3-conformance/t3-pin.json"
version_pointer = "/version"
commit_pointer = "/commit"
timeout_ms = 900000
live_when_named = "downloads and runs the pinned release: `wf mimic verify <set> --live`, on the VM"

[record]
# the pinned reference is a live server whose ids and timestamps move between two records
allow_nondeterministic = true
