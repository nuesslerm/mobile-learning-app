# R2c crawl: every case of t3-api (valid, boundary, invalid inputs of every endpoint), recorded on the VM against the real pinned server in chunks. Inputs: `wf mimic crawl` of $1-api.
rules = "rules.json"
corpus = "corpus.json"
allowlist = "allowlist.json"

[diff]
ignore_dirs = ["c2s"]
breaking_paths = ["steps.http:ret:_.payload.status", "steps.ws:open:s2c:_.payload.status"]
advertised_prefixes = ["capabilities."]

[diff.fold]
channel = "ws"
tag = "/_tag"
chunk = "Chunk"
values = "/values"
once = [["/kind", "snapshot"]]
squash = ["/exit/cause"]

[reference]
name = "t3"
command = ["node", "../../../../tooling/mimic-drivers/src/cli.ts", "serve", "t3"]
pin = "../../../../tooling/t3-conformance/t3-pin.json"
version_pointer = "/version"
commit_pointer = "/commit"
timeout_ms = 900000
live_when_named = "downloads and runs the pinned release: `wf mimic verify <set> --live`, on the VM"

[record]
write_chunk = 40
stability_pct = 8
