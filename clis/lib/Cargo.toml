[package]
name = "wf-lib"
version = "0.1.0"
edition = "2021"
publish = false
description = "`wf lib`: versioned shared libraries on blob storage, a static Cargo sparse registry under the bucket's libs/ prefix"

# The test kit hides every secret the registry names from the binary it runs.
[package.metadata.flow]
inputs = ["../secrets/src/data/registry.json"]

# The tests are one flow binary (tests/flow.rs) driving the thin binary below.
[lib]
test = false
doctest = false

[[bin]]
name = "wf-lib"
path = "src/bin/wf-lib.rs"
test = false

[features]
# The in-memory bucket the flow tests serve over loopback.
testing = ["dep:tiny_http"]

[dependencies]
wf-kit = { path = "../wf-kit" }
secrets = { path = "../secrets" }
blob-cache = { path = "../blob-cache" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.22"
tiny_http = { version = "0.12", optional = true }
tempfile = "3"

[dev-dependencies]
wf-lib = { path = ".", features = ["testing"] }
wf-testkit = { path = "../wf-testkit" }
