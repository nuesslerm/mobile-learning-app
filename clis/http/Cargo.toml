[package]
name = "cli-http"
version = "0.1.0"
edition = "2021"
description = "The one blocking HTTP client of the CLIs: ureq with the proxy, redirect and timeout choices their call sites used to give curl"
publish = false

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy", "gzip"] }
base64 = "0.22"
serde_json = "1"
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"

[dev-dependencies]
tiny_http = "0.12"
