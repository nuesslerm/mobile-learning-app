id: core-does-no-io
language: rust
severity: error
message: rca-core is pure; it does no file, socket, process or environment access. An adapter crate implements the port it declares.
files:
  - "**/libraries/rca-core/src/**/*.rs"
ignores:
  - "**/libraries/rca-core/src/file_store.rs"
rule:
  matches: does-io
  not: { inside: { kind: mod_item, stopBy: end, has: { field: name, regex: '^tests?$' } } }
