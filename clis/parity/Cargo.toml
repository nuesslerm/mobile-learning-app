[package]
name = "parity"
version = "0.1.0"
edition = "2021"
publish = false
description = "`wf parity`: the parity coverage tables of the T3 Code and Orca phone apps over the agent API (docs/plans/rca-parity)"

# The tests are one flow binary (tests/flow.rs) driving the thin binary below over fixture trees and the repo's own tables; the
# scans and the table rules have unit tests in parity-core.
[lib]
test = false
doctest = false

[[bin]]
name = "wf-parity"
path = "src/bin/wf-parity.rs"
test = false

[package.metadata.flow]
inputs = [
    "../../docs/plans/rca-parity/coverage/**",
    "../../tooling/t3-conformance/t3-pin.json",
    "../../tooling/orca-conformance/orca-pin.json",
    "../t3-serve/cassettes/t3-recorded-*/**",
    "../orca-serve/cassettes/orca-recorded/**",
    "../t3-serve/contracts/src/rpc.rs",
    "../t3-serve/core/src/domain/decider.rs",
    "../t3-serve/core/src/domain/command.rs",
    "../t3-serve/http/src/http.rs",
]

[dependencies]
wf-kit = { path = "../wf-kit" }
cli-http = { path = "../http" }
parity-core = { path = "core" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
parity-core = { path = "core", features = ["testing"] }
tempfile = "3"
tiny_http = "0.12"
