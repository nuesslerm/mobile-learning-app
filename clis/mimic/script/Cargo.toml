# The step interpreter of `wf mimic` and its adapters: versioned libraries (libraries.json), so a consumer takes a released version and updates
# gradually. A workspace of their own: wf-mimic, t3-serve and orca-serve resolve them from the mla registry, never by path.
[workspace]
resolver = "2"
members = ["core", "net"]

[profile.dev]
debug = "line-tables-only"
