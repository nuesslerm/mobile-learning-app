[package]
name = "mimic-script-orca"
version = "0.1.3"
edition = "2021"
publish = false
description = "The Orca target of the `wf mimic` step interpreter: starts the codec sidecar around the phone's own client, makes the deterministic scratch repositories a case needs and masks their paths"
# What a published crate holds: fixtures, cassettes and tests stay out unless named here (`wf lib release` refuses a manifest without it).
include = ["src/**", "Cargo.toml"]

[lib]
doctest = false

[dependencies]
mimic-script-core = { version = "0.1.6", registry = "mla" }
mimic-script-net = { version = "0.1.5", registry = "mla" }
mimic-script-host = { version = "0.1.10", registry = "mla" }

[dev-dependencies]
mimic-core = { version = "0.1.2", registry = "mla" }
serde_json = "1"

[package.metadata.arch]
type = "cli-crate"
