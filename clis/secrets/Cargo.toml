[package]
name = "secrets"
version = "0.1.0"
edition = "2021"
publish = false
description = "`wf secret`: the registry of every secret, the vault and keychain backends behind it, the sealed local copy and the writers"

# The agent deny rules and guard script keep value-revealing subcommands from agents; the tests read every committed .env.defaults.
[package.metadata.flow]
inputs = ["../../libraries/hook-runtime/src/deny.json", "../../scripts/guards/block-secret-exposure.mjs", "../../**/.env.defaults", "../../.github/workflows/*.yml"]

# The tests are one flow binary (tests/flow.rs) driving the thin binary below; the lib has no unit tests (plan D3).
[lib]
test = false
doctest = false

# Serves only `wf secret`, which is all this crate's flow tests spawn.
[[bin]]
name = "secrets"
path = "src/bin/secrets.rs"
test = false

[dependencies]
wf-kit = { path = "../wf-kit" }
cli-http = { path = "../http" }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
wf-testkit = { path = "../wf-testkit" }
tempfile = "3"
