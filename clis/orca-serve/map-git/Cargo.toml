[package]
name = "orca-map-git"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca mapping crate for the phone's git rows: status, history, branches, staging, commit, the remote operations, conflicts and the branch and commit comparisons and the commit page link over rca's git group and its hosted remotes, behind the AgentApi port of orca-core"

[lib]
doctest = false

[features]
testing = ["orca-core/testing"]

[dependencies]
orca-core = { path = "../core" }
orca-map-workspace = { path = "../map-workspace" }
orca-map-hosted = { path = "../map-hosted" }
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-git = { path = "../../../libraries/agent-api/agent-api-git" }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"

[dev-dependencies]
orca-core = { path = "../core", features = ["testing"] }
orca-map-workspace = { path = "../map-workspace", features = ["testing"] }
orca-map-git = { path = ".", features = ["testing"] }

[package.metadata.arch]
type = "cli-crate"

# The rows of the recorded sets this crate answers: a change to it (or a crate it depends on) replays these rows alone, as the Nx task `replay-orca-map-git` of orca-serve (`wf test plan`).
[package.metadata.integration.replay]
rows = ["rpc:git."]
