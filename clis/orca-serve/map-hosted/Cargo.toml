[package]
name = "orca-map-hosted"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca mapping crate for the phone's hosted source control rows: the pull and merge request rows of github.* and gitlab.* and the PR and MR worktree bases, over rca's hosted.pr group and git.fetch, behind the AgentApi port of orca-core"

[lib]
doctest = false

[features]
testing = ["orca-core/testing"]

[dependencies]
orca-core = { path = "../core" }
orca-map-workspace = { path = "../map-workspace" }
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-git = { path = "../../../libraries/agent-api/agent-api-git" }
agent-api-hosted = { path = "../../../libraries/agent-api/agent-api-hosted" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
orca-core = { path = "../core", features = ["testing"] }
orca-map-workspace = { path = "../map-workspace", features = ["testing"] }
orca-map-hosted = { path = ".", features = ["testing"] }
