[package]
name = "orca-map-workspace"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca mapping crate for the phone's files and projects: files.*, folderWorkspace.list and mobileRelay.projectSections over rca's workspace and file agent methods, behind the AgentApi port of orca-core"

[lib]
doctest = false

[features]
testing = ["orca-core/testing"]

[dependencies]
orca-core = { path = "../core" }
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-workspace = { path = "../../../libraries/agent-api/agent-api-workspace" }
agent-api-git = { path = "../../../libraries/agent-api/agent-api-git" }
agent-api-state = { path = "../../../libraries/agent-api/agent-api-state" }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"

[dev-dependencies]
orca-core = { path = "../core", features = ["testing"] }
orca-map-workspace = { path = ".", features = ["testing"] }
