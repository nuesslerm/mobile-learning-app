[package]
name = "orca-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca-compatible server's pure core: the wire envelope, the Area trait each mapping crate implements, the assembled method table and the per-connection dispatcher, behind the AgentApi port"

[lib]
doctest = false

[features]
# In-memory doubles of every port.
testing = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
orca-core = { path = ".", features = ["testing"] }

[package.metadata.arch]
type = "rust-flat-core"

# The rows of the recorded sets this crate answers: a change to it (or a crate it depends on) replays these rows alone, as the Nx task `replay-orca-core` of orca-serve (`wf test plan`).
[package.metadata.integration.replay]
rows = ["rpc:agentHooks.", "rpc:agentTeams.", "rpc:artifacts.", "rpc:computer.", "rpc:connector.", "rpc:desktopBrowserBridge.", "rpc:diagnostics.", "rpc:emulator.", "rpc:environment.", "rpc:layout.", "rpc:linkPreview.", "rpc:managedRuntime.", "rpc:managedServer.", "rpc:orcad.", "rpc:plugins.", "rpc:reference.", "rpc:runtimeEnvironment.", "rpc:sidebarInputs.", "rpc:sidebarSession.", "rpc:terminalDaemon.", "rpc:updater.", "rpc:workspaceCleanup.", "rpc:workspacePorts.", "transport:"]
