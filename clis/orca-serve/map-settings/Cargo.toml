[package]
name = "orca-map-settings"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca mapping crate for the host's own status: status.get, host.platform, the connection's client capabilities and the client-events stream"

[lib]
doctest = false

[dependencies]
orca-map-browser = { path = "../map-browser" }
orca-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }

[package.metadata.arch]
type = "cli-crate"

# The rows of the recorded sets this crate answers: a change to it (or a crate it depends on) replays these rows alone, as the Nx task `replay-orca-map-settings` of orca-serve (`wf test plan`).
[package.metadata.integration.replay]
rows = ["rpc:host.", "rpc:jira.", "rpc:linear.", "rpc:pairing.", "rpc:runtime.", "rpc:stats.", "rpc:status."]
