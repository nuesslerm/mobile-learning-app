[package]
name = "orca-map-terminal"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orca mapping crate for the phone's terminals: terminal.list, send, close, clearBuffer and rename over rca's terminal group, behind the AgentApi port of orca-core"

[lib]
doctest = false

[features]
testing = ["orca-core/testing"]

[dependencies]
orca-core = { path = "../core" }
orca-map-workspace = { path = "../map-workspace" }
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-terminal = { path = "../../../libraries/agent-api/agent-api-terminal" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
orca-core = { path = "../core", features = ["testing"] }
orca-map-workspace = { path = "../map-workspace", features = ["testing"] }
orca-map-terminal = { path = ".", features = ["testing"] }
agent-api-terminal = { path = "../../../libraries/agent-api/agent-api-terminal", features = ["testing"] }
