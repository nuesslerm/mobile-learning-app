[package]
name = "exec-fs"
version = "0.1.0"
edition = "2021"
publish = false
description = "The executor's file actions (read_file, write_file, edit_file, list_dir, search): their arguments and results, and how a request's args are read"

[lib]
doctest = false

[features]
testing = ["exec-proto/testing"]

[dependencies]
exec-proto = { path = "../exec-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
