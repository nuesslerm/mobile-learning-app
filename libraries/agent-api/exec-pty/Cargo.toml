[package]
name = "exec-pty"
version = "0.1.0"
edition = "2021"
publish = false
description = "The executor's pty actions (pty_open, pty_write, pty_resize, pty_close, pty_list, pty_attach): their arguments, results, events and the binary output frame, and how a request's args are read"

[lib]
doctest = false

[features]
testing = ["exec-proto/testing"]

[dependencies]
exec-proto = { path = "../exec-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
