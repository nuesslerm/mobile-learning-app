[package]
name = "rca-ladder"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
rca-core = { version = "0.1", registry = "mla", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
