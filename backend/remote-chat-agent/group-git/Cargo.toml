[package]
name = "rca-group-git"
version = "0.1.0"
edition = "2021"
publish = false
description = "The git group of the service's agent API: the repository of a workspace (or of a worktree) read and changed by the executor that owns it, and the stream of its status"

[lib]
name = "rca_group_git"
path = "src/lib.rs"
doctest = false

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-git = { path = "../../../libraries/agent-api/agent-api-git" }
rca-agent-core = { path = "../agent-core" }
rca-exec-channel = { path = "../exec-channel" }
exec-proto = { path = "../../../libraries/agent-api/exec-proto" }
exec-git = { path = "../../../libraries/agent-api/exec-git" }

[dev-dependencies]
rca-exec-channel = { path = "../exec-channel", features = ["testing"] }
