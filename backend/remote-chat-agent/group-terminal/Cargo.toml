[package]
name = "rca-group-terminal"
version = "0.1.0"
edition = "2021"
publish = false
description = "The terminal group of the service's agent API: shells the executor of a workspace runs on ptys, their output kept as a bounded tail numbered by byte offset, and re-attached by offset after an executor reconnect"

[lib]
name = "rca_group_terminal"
path = "src/lib.rs"
doctest = false

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-terminal = { path = "../../../libraries/agent-api/agent-api-terminal" }
rca-agent-core = { path = "../agent-core" }
rca-exec-channel = { path = "../exec-channel" }
exec-proto = { path = "../../../libraries/agent-api/exec-proto" }
exec-pty = { path = "../../../libraries/agent-api/exec-pty" }

[dev-dependencies]
rca-exec-channel = { path = "../exec-channel", features = ["testing"] }
