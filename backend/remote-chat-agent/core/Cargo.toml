[package]
name = "remote-chat-agent-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "remote_chat_agent_core"
path = "src/lib.rs"

[features]
# The doubles of the ports (`testing`), for the service crate's tests
testing = ["dep:url"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["macros"] }
rca-ladder = { version = "0.1", registry = "mla" }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
