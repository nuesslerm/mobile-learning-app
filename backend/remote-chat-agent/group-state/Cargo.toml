[package]
name = "rca-group-state"
version = "0.1.0"
edition = "2021"
publish = false
description = "The state and state.watch groups of the service's agent API: per-device values kept through the StateStore port, and a per-scope stream of their changes numbered by a bounded seq"

[lib]
name = "rca_group_state"
path = "src/lib.rs"
doctest = false

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto" }
agent-api-state = { path = "../../../libraries/agent-api/agent-api-state" }
rca-agent-core = { path = "../agent-core" }

[dev-dependencies]
agent-api-proto = { path = "../../../libraries/agent-api/agent-api-proto", features = ["testing"] }

[features]
testing = []
