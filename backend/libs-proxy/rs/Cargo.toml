[package]
name = "libs-proxy-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "libs_proxy"
path = "src/lib.rs"

[[bin]]
name = "libs-proxy-rs"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
libs-proxy-core = { path = "../core" }
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
libs-proxy-core = { path = "../core", features = ["testing"] }
http-body-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "net"] }
tower = { workspace = true, features = ["util"] }
