  - "**/leetcode-auth-cookie-capture/rs/src/infrastructure/**/*.rs"
  - "**/leetcode-backend/rs/src/infrastructure/**/*.rs"
  - "**/remote-chat-agent/rs/src/infrastructure/**/*.rs"
  - "**/reporting-service/rs/src/infrastructure/**/*.rs"
  - "**/vm-ops-api/rs/src/infrastructure/**/*.rs"
  - "**/watchdog/rs/src/infrastructure/**/*.rs"
  # END generated:ast-grep-files
rule:
  matches: names-api
