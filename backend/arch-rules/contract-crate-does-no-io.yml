id: contract-crate-does-no-io
language: rust
severity: error
message: "A wire-contract crate (a package of type rust-contract) is pure; it parses and encodes, and does no file, socket, process or environment access. Its loader of recorded exchanges lives in src/testing.rs."
note: "The globs are generated from package-types.json (`wf check --layout --write`). `wf check --budget` reads them to check these crates' manifests too (core_purity, `backend-core-io-violations`), so keep one glob per line."
