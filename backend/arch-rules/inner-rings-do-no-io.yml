id: inner-rings-do-no-io
language: rust
severity: error
message: The domain and application layers do no file, socket, process or environment access; an adapter in infrastructure implements the port they declare.
files:
  - "**/src/domain/**/*.rs"
  - "**/src/application/**/*.rs"
ignores:
  # A snapshot reader of the tests; the module is only compiled for them.
  - "**/vm-ops-api/core/src/application/scripts/golden.rs"
rule:
  matches: does-io
  not:
    inside:
      kind: mod_item
      stopBy: end
      has:
        field: name
        regex: '^tests?$'
