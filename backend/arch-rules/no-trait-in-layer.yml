id: no-trait-in-layer
language: rust
severity: error
message: "A domain or api module declares no trait; a port lives in the core crate (application) and the layer that implements it names it from there. An extension trait is a free function or an inherent method."
note: "The globs are generated from package-types.json (`wf check --layout --write`): the domain ring of a rust-core and the api ring of a rust-rs."
files:
  # BEGIN generated:ast-grep-files
  - "**/clis/mimic/proxy-core/src/domain/**/*.rs"
  - "**/leetcode-auth-cookie-capture/core/src/domain/**/*.rs"
  - "**/leetcode-auth-cookie-capture/rs/src/api/**/*.rs"
  - "**/leetcode-backend/rs/src/api/**/*.rs"
  - "**/remote-chat-agent/cli-driver/src/domain/**/*.rs"
  - "**/remote-chat-agent/core/src/domain/**/*.rs"
  - "**/remote-chat-agent/rs/src/api/**/*.rs"
  - "**/remote-chat-agent/service-core/src/domain/**/*.rs"
  - "**/reporting-service/core/src/domain/**/*.rs"
  - "**/reporting-service/rs/src/api/**/*.rs"
  - "**/vm-ops-api/core/src/domain/**/*.rs"
  - "**/vm-ops-api/rs/src/api/**/*.rs"
  - "**/watchdog/core/src/domain/**/*.rs"
  # END generated:ast-grep-files
rule:
  kind: trait_item
  not: { inside: { kind: mod_item, stopBy: end, has: { field: name, regex: '(^|_)tests?$' } } }
