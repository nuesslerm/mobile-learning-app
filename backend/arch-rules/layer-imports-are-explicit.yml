id: layer-imports-are-explicit
language: rust
severity: error
message: "A module of a layer names what it imports. A glob import (`use x::*`), a `self::` path and a `#[path]` module hide which layer a name comes from, so the direction rules cannot see it."
note: "The globs are generated from package-types.json (`wf check --layout --write`): every ring directory of every typed Rust package. A glob inside a test module is allowed."
files:
  # BEGIN generated:ast-grep-files
  - "**/clis/mimic/proxy-core/src/application/**/*.rs"
  - "**/clis/mimic/proxy-core/src/domain/**/*.rs"
  - "**/clis/rca-exec/src/adapters/**/*.rs"
  - "**/clis/rca-exec/src/bin/**/*.rs"
  - "**/clis/t3-serve/core/src/domain/**/*.rs"
  - "**/leetcode-auth-cookie-capture/core/src/application/**/*.rs"
  - "**/leetcode-auth-cookie-capture/core/src/domain/**/*.rs"
  - "**/leetcode-auth-cookie-capture/rs/src/api/**/*.rs"
  - "**/leetcode-auth-cookie-capture/rs/src/infrastructure/**/*.rs"
  - "**/leetcode-backend/core/src/application/**/*.rs"
  - "**/leetcode-backend/rs/src/api/**/*.rs"
  - "**/leetcode-backend/rs/src/infrastructure/**/*.rs"
  - "**/remote-chat-agent/cli-driver/src/application/**/*.rs"
  - "**/remote-chat-agent/cli-driver/src/domain/**/*.rs"
  - "**/remote-chat-agent/core/src/application/**/*.rs"
  - "**/remote-chat-agent/core/src/domain/**/*.rs"
  - "**/remote-chat-agent/core/src/testing/**/*.rs"
  - "**/remote-chat-agent/rs/src/api/**/*.rs"
  - "**/remote-chat-agent/rs/src/infrastructure/**/*.rs"
  - "**/remote-chat-agent/service-core/src/application/**/*.rs"
  - "**/remote-chat-agent/service-core/src/domain/**/*.rs"
  - "**/reporting-service/core/src/application/**/*.rs"
  - "**/reporting-service/core/src/domain/**/*.rs"
  - "**/reporting-service/rs/src/api/**/*.rs"
  - "**/reporting-service/rs/src/infrastructure/**/*.rs"
  - "**/vm-ops-api/core/src/application/**/*.rs"
  - "**/vm-ops-api/core/src/domain/**/*.rs"
  - "**/vm-ops-api/core/src/testing/**/*.rs"
  - "**/vm-ops-api/rs/src/api/**/*.rs"
  - "**/vm-ops-api/rs/src/infrastructure/**/*.rs"
  - "**/watchdog/core/src/application/**/*.rs"
  - "**/watchdog/core/src/domain/**/*.rs"
  - "**/watchdog/rs/src/infrastructure/**/*.rs"
  # END generated:ast-grep-files
rule:
  any:
    - kind: use_wildcard
    - kind: scoped_identifier
      regex: '^self::'
      inside: { kind: use_declaration, stopBy: end }
    - kind: scoped_use_list
      regex: '^self::'
    - kind: attribute_item
      regex: '^#\[path\b'
  not: { inside: { kind: mod_item, stopBy: end, has: { field: name, regex: '(^|_)tests?$' } } }
