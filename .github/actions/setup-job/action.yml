name: Setup job
description: >-
  What a job of pipeline.yml needs before its own steps on a GitHub-hosted runner: the tailnet, toolchains and the wf artifact (the hosted-setup
  action), or for a job that builds wf itself (`wf-source: none`) only the tailnet and the vault client. The caller has checked the repository out.
inputs:
  wf-source:
    description: "none (no wf, the job builds it) or artifact (the artifact the wf-build job uploaded)"
    default: artifact
  artifact:
    description: The artifact holding the binaries (clis for x64, clis-arm for arm64)
    default: clis
  job:
    description: The job's name (the runner sampler's file name)
    required: true
  install:
    description: Fill the pnpm store from the bucket and run pnpm install
    default: "true"
  save-pnpm:
    description: Save the pnpm store to the GitHub Actions cache after the install when the exact key missed
    default: "false"
  ts-client-id:
    description: The Tailscale OAuth client id
    default: ""
  ts-secret:
    description: Its secret
    default: ""
  keep-android:
    description: Keep the Android SDK on the runner (the Android e2e job's emulator)
    default: "false"
  apt-packages:
    description: System packages a job needs, installed before the tailnet join (see the hosted-apt action)
    default: ""
runs:
  using: composite
  steps:
    - name: The runner's environment
      shell: bash
      run: |
        # the tailnet joins in kernel mode here: wf routes by the environment, not through the userspace SOCKS listener it defaults to
        echo "WF_TAILNET_SOCKS=" >> "$GITHUB_ENV"
        echo "BWS_SERVER_URL=https://vault.bitwarden.eu" >> "$GITHUB_ENV"

    - uses: ./.github/actions/hosted-dns
    - uses: ./.github/actions/hosted-apt
      if: ${{ inputs.apt-packages != '' }}
      with:
        packages: ${{ inputs.apt-packages }}

    - uses: ./.github/actions/hosted-setup
      if: ${{ inputs.wf-source != 'none' }}
      with:
        job: ${{ inputs.job }}
        ts-client-id: ${{ inputs.ts-client-id }}
        ts-secret: ${{ inputs.ts-secret }}
        install: ${{ inputs.install }}
        save-pnpm: ${{ inputs.save-pnpm }}
        clis-artifact: ${{ inputs.artifact }}
        keep-android: ${{ inputs.keep-android }}
    - uses: ./.github/actions/hosted-stats
      if: ${{ inputs.wf-source == 'none' }}
      with:
        mode: start
        job: ${{ inputs.job }}
    - name: Join the tailnet as tag:ci-gh-hosted
      if: ${{ inputs.wf-source == 'none' }}
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
      with:
        oauth-client-id: ${{ inputs.ts-client-id }}
        oauth-secret: ${{ inputs.ts-secret }}
        tags: tag:ci-gh-hosted
        use-cache: 'false'
    - uses: ./.github/actions/install-bws
      if: ${{ inputs.wf-source == 'none' }}
