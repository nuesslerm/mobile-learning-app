name: Bench setup
description: >-
  What a job of cache-bench.yml needs and needs no secret or tailnet for: the timing helpers (`$BENCH_LIB`, sourced by the job's steps),
  and on request node and pnpm (with `pnpm install`), the pinned Rust toolchain and a freed disk. The caller has checked the repository out.
inputs:
  node:
    description: node and pnpm on PATH
    default: "false"
  install:
    description: Run pnpm install --frozen-lockfile (untimed; needs node)
    default: "false"
  rust:
    description: The Rust toolchain the repository pins, cargo on PATH
    default: "false"
  free-disk:
    description: Delete the runner image's large unused toolchains in the background (a cold debug build fills the disk otherwise)
    default: "false"
runs:
  using: composite
  steps:
    - name: Timing helpers
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bench"
        cat > "$RUNNER_TEMP/bench/lib.sh" <<'LIB'
        # exported: the scripts the steps write (fetch.sh, nx.sh, build.sh) run as child processes and read it
        export BENCH_DIR="$RUNNER_TEMP/bench"
        BENCH_KEY="bench-${GITHUB_RUN_ID}-${BENCH_NAME:-x}"
        mark() { date +%s.%N > "$BENCH_DIR/t.$1"; }
        since() { awk -v a="$(cat "$BENCH_DIR/t.$1" 2>/dev/null || true)" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }'; }
        setv() { printf '%s' "$2" > "$BENCH_DIR/v.$1"; }
        getv() { if [ -s "$BENCH_DIR/v.$1" ]; then cat "$BENCH_DIR/v.$1"; else printf null; fi; }
        mbof() { local m; m=$(du -smc "$@" 2>/dev/null | tail -1 | cut -f1 || true); echo "${m:-0}"; }
        # the compressed size the cache service holds for an exact key (the listing can lag a save by a few seconds)
        saved_mb() {
          local b=""
          for _ in 1 2 3 4 5 6; do
            b=$(gh cache list --key "$1" --limit 100 --json key,sizeInBytes --jq "[.[] | select(.key == \"$1\")][0].sizeInBytes // empty" 2>/dev/null || true)
            [ -z "$b" ] || break
            sleep 5
          done
          if [ -n "$b" ]; then awk -v b="$b" 'BEGIN { printf "%.0f", b / 1048576 }'; else printf null; fi
        }
        # emit <layer> <variant> <cold_s> <restore_s> <warm_s> <cache_mb> <saved_mb_compressed> [extra-json-object]
        emit() {
          local net extra line
          extra=${8:-}; [ -n "$extra" ] || extra='{}'
          net=$(awk -v c="${3:-null}" -v r="${4:-null}" -v w="${5:-null}" 'BEGIN { if (c == "null" || r == "null" || w == "null") print "null"; else printf "%.1f", c - (r + w) }')
          line=$(jq -cn --arg layer "$1" --arg variant "$2" --argjson cold_s "${3:-null}" --argjson restore_s "${4:-null}" --argjson warm_s "${5:-null}" \
            --argjson cache_mb "${6:-null}" --argjson saved_mb_compressed "${7:-null}" --argjson net_s "$net" --argjson extra "$extra" \
            '{layer: $layer, variant: $variant, cold_s: $cold_s, restore_s: $restore_s, warm_s: $warm_s, cache_mb: $cache_mb, saved_mb_compressed: $saved_mb_compressed, net_s: $net_s} + $extra')
          echo "BENCH $line"
          echo "$line" >> "$BENCH_DIR/lines.jsonl"
        }
        # the job's own caches go as soon as it has measured them, so the quota the real pipeline shares is held for minutes
        bench_cleanup() {
          gh cache list --key "$BENCH_KEY" --limit 100 --json id --jq '.[].id' 2>/dev/null | while read -r id; do gh cache delete "$id" || true; done || true
        }
        append_comment() {
          [ -f "$1" ] || { echo "::error::narrow change: no such file: '$1'"; return 1; }
          printf '\n// cache-bench: narrow change\n' >> "$1"
          echo "narrow change appended to $1"
        }
        # the tracked, non-test TypeScript file under a path that comes first
        ts_leaf() { git ls-files "$1" | grep -E '\.tsx?$' | grep -vE '\.(test|spec|d)\.|/(e2e|tests?|__tests__)/' | sed -n 1p || true; }
        # the lib or bin source of the named crate that the fewest workspace crates depend on, in the workspace of $BENCH_MANIFEST (default clis/Cargo.toml).
        # Fails, with an error annotation, on no match: a crate that is not a member of that workspace gives the string null from jq.
        leaf_crate_source() {
          local want src manifest=${BENCH_MANIFEST:-clis/Cargo.toml}
          want=$(printf '%s\n' "$@" | jq -R . | jq -cs .) || return 1
          src=$(cargo metadata --no-deps --format-version 1 --manifest-path "$manifest" | jq -r --argjson want "$want" '
            .packages as $p
            | [$p[] | select(.name | IN($want[])) | . as $c
              | {src: ([.targets[] | select(.kind | any(. == "lib" or . == "bin"))][0].src_path),
                 users: ([$p[] | select(any(.dependencies[]; .name == $c.name))] | length)}]
            | sort_by(.users) | .[0].src // empty') || src=""
          if [ -z "$src" ] || [ "$src" = null ] || [ ! -f "$src" ]; then
            echo "::error::leaf_crate_source: no lib or bin source for [$*] among the members of $manifest (got '$src')" >&2
            return 1
          fi
          printf '%s\n' "$src"
        }
        LIB
        {
          echo "BENCH_LIB=$RUNNER_TEMP/bench/lib.sh"
          echo "GH_REPO=$GITHUB_REPOSITORY"
        } >> "$GITHUB_ENV"
    - name: Free the runner's disk in the background
      if: ${{ inputs.free-disk == 'true' }}
      shell: bash
      run: |
        (sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift >/dev/null 2>&1 &)
        df -h / | tail -1
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      if: ${{ inputs.node == 'true' }}
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      if: ${{ inputs.node == 'true' }}
      with:
        node-version: 22.22.0
    - name: pnpm install (not timed)
      if: ${{ inputs.node == 'true' && inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Rust toolchain
      if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: |
        rustup toolchain install --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
