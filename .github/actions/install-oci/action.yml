name: Install oci
description: The OCI CLI and the vault's OCI credentials, so wf can read and write the verify bucket.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        command -v oci >/dev/null || pip install --quiet oci-cli
        wf vm creds sync
        oci --version
