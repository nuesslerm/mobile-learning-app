name: Install test deps
description: >-
  The tools a test stage runs beside the workspace, each one only when asked and a no-op on a runner that has it: Chromium for Playwright,
  ffmpeg, restic and sqlite3, opencode, bun, java, the Rust toolchain on PATH and the pinned reference trees. The caller has run
  setup-job (pnpm install) first. The reference trees are deinitialized by the job's own last step.
inputs:
  playwright:
    description: Chromium for the browser harness
    default: "false"
  ffmpeg:
    description: ffmpeg, for the tests that record video
    default: "false"
  restic-sqlite:
    description: restic and sqlite3, for the deploy flow tests
    default: "false"
  opencode:
    description: The opencode binary the offload parity e2e runs
    default: "false"
  bun:
    description: bun
    default: "false"
  java:
    description: Java 21, for the Android selector flow test
    default: "false"
  rust:
    description: The Rust toolchain on PATH (a Rust package's test target runs cargo)
    default: "false"
  references:
    description: The pinned reference trees (references/orca, references/t3code), shallow
    default: "false"
  browser-harness:
    description: The built device-frame page (tooling/browser-harness/dist), which the browser tests open and a fresh checkout does not have
    default: "false"
runs:
  using: composite
  steps:
    # bun is a GitHub release download that answered 504 in bursts: two more tries after a failed one
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: ${{ inputs.bun == 'true' }}
      id: bun
      continue-on-error: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: ${{ inputs.bun == 'true' && steps.bun.outcome == 'failure' }}
      id: bun-retry
      continue-on-error: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: ${{ inputs.bun == 'true' && steps.bun.outcome == 'failure' && steps.bun-retry.outcome == 'failure' }}
    # a hosted runner's apt mirror stalled one shard for 17 minutes (run 42737343615): a stalled connection retries instead of waiting
    - name: apt retries and timeouts
      if: ${{ inputs.playwright == 'true' || inputs.ffmpeg == 'true' || inputs.restic-sqlite == 'true' }}
      shell: bash
      run: |
        sudo=$([ "$(id -u)" = 0 ] || echo sudo)
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | $sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
    # the two shallow clones take 56 s in every job that reads references/ (bench, run 43558013495): their git objects are cached by the pinned commits
    - name: Key of the reference trees' git objects
      id: refs-key
      if: ${{ inputs.references == 'true' && contains(env.CACHE_BACKENDS || 'gha', 'gha') }}
      shell: bash
      run: echo "key=refs-$(git ls-tree HEAD references/orca references/t3code | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore the reference trees' git objects
      id: refs-cache
      if: ${{ inputs.references == 'true' && contains(env.CACHE_BACKENDS || 'gha', 'gha') }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .git/modules/references
        key: ${{ steps.refs-key.outputs.key }}
    - uses: ./.github/actions/cache-summary
      if: ${{ inputs.references == 'true' && contains(env.CACHE_BACKENDS || 'gha', 'gha') }}
      with:
        layer: references
        hit: ${{ steps.refs-cache.outputs.cache-hit }}
        matched-key: ${{ steps.refs-cache.outputs.cache-matched-key }}
        paths: .git/modules/references
    - name: Reference trees
      if: ${{ inputs.references == 'true' }}
      shell: bash
      run: |
        # an automatic gc rewrites a pack while the cache save archives it (the bench save failed on that)
        git config --global gc.auto 0
        git config --global maintenance.auto false
        git submodule update --init --recommend-shallow --depth 1 references/orca references/t3code
    - name: Save the reference trees' git objects
      if: ${{ inputs.references == 'true' && contains(env.CACHE_BACKENDS || 'gha', 'gha') && steps.refs-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .git/modules/references
        key: ${{ steps.refs-key.outputs.key }}
    - name: Chromium for Playwright
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: |
        # `install --with-deps` checks the browser and the system packages on every call: only a new Playwright version needs it
        version=$(pnpm --filter @lib/browser-client exec playwright --version | tr -c '0-9a-z.\n' '_')
        marker="$HOME/.cache/ms-playwright/.installed-$version"
        [ -f "$marker" ] && exit 0
        # apt can stall on a mirror with no output for the rest of the job: bound each try, kill the stuck apt, try again
        sudo=$([ "$(id -u)" = 0 ] || echo sudo)
        for attempt in 1 2 3; do
          if timeout -k 10 420 pnpm --filter @lib/browser-client exec playwright install --with-deps chromium; then
            mkdir -p "$(dirname "$marker")" && touch "$marker"; exit 0
          fi
          echo "playwright: attempt $attempt failed or stalled"
          $sudo pkill -9 -x apt-get || true; $sudo pkill -9 -x dpkg || true; $sudo dpkg --configure -a || true
        done
        exit 1
    - name: Device-frame page
      if: ${{ inputs.browser-harness == 'true' }}
      shell: bash
      run: pnpm --filter @tooling/browser-harness run build
    - name: ffmpeg
      if: ${{ inputs.ffmpeg == 'true' }}
      shell: bash
      run: |
        sudo=$([ "$(id -u)" = 0 ] || echo sudo)
        command -v ffmpeg >/dev/null || { $sudo dpkg --configure -a; $sudo apt-get update -qq && $sudo apt-get install -y -qq ffmpeg; }
    - name: restic and sqlite3
      if: ${{ inputs.restic-sqlite == 'true' }}
      shell: bash
      run: |
        sudo=$([ "$(id -u)" = 0 ] || echo sudo)
        command -v restic >/dev/null && command -v sqlite3 >/dev/null || { $sudo dpkg --configure -a; $sudo apt-get update -qq && $sudo apt-get install -y -qq restic sqlite3; }
    - name: opencode
      if: ${{ inputs.opencode == 'true' }}
      shell: bash
      run: command -v opencode >/dev/null || npm install -g opencode-ai@1.19.0
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      if: ${{ inputs.java == 'true' }}
      with:
        distribution: temurin
        java-version: 21
    - name: Rust toolchain on PATH
      if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: |
        [ -x "$HOME/.cargo/bin/cargo" ] || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        # rust-toolchain.toml pins rustc (Nx hashes it); rustup 1.28+ installs the channel only on request, and a half-made install counts as existing
        export PATH="$HOME/.cargo/bin:$PATH"
        pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        cargo --version >/dev/null 2>&1 || { rustup toolchain uninstall "$pin" || true; rustup toolchain install --profile minimal; }
        # shellcheck disable=SC2012
        ls "$HOME/.rustup/toolchains/"*"/bin" | tr '\n' ' '; echo; cargo --version
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    # the build-cache shim serves compiles from the bucket through its own WebDAV endpoint, so sccache needs no key here; a failed download leaves compiles uncached
    - uses: ./.github/actions/install-sccache
      if: ${{ inputs.rust == 'true' }}
      continue-on-error: true
