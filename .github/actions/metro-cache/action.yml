name: App build cache
description: >-
  Restores or saves the app's build state (Metro's transform cache and tsc's build info, one directory) with actions/cache. The key
  is the hash of the files that decide whether old state is usable plus the ISO week, not the commit: Metro and tsc key their own entries by
  file content, so one entry per input hash serves every commit until an input changes, and a new week refreshes it. An entry cannot be
  overwritten, so a save happens only on a green job and only when the exact key missed.
inputs:
  mode:
    description: restore or save
    required: true
  scope:
    description: Which consumer owns the entry (typecheck for tsc, export for Metro), so the two do not overwrite each other
    required: true
  suffix:
    description: Splits a scope further, for example a matrix shard that builds its own state
    default: all
runs:
  using: composite
  steps:
    - name: Key of the app build cache
      if: ${{ inputs.mode == 'restore' }}
      id: key
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - name: Restore the app build state
      id: restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: frontend/mla-tamagui/node_modules/.cache/app-build
        key: metro-${{ inputs.scope }}-${{ inputs.suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.week }}-${{ hashFiles('pnpm-lock.yaml', 'frontend/mla-tamagui/package.json', 'frontend/mla-tamagui/metro.config.js', 'frontend/mla-tamagui/babel.config.js', 'frontend/mla-tamagui/tsconfig.json') }}
        restore-keys: |
          metro-${{ inputs.scope }}-${{ inputs.suffix }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Remember the key
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      env:
        KEY: metro-${{ inputs.scope }}-${{ inputs.suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.week }}-${{ hashFiles('pnpm-lock.yaml', 'frontend/mla-tamagui/package.json', 'frontend/mla-tamagui/metro.config.js', 'frontend/mla-tamagui/babel.config.js', 'frontend/mla-tamagui/tsconfig.json') }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: printf 'KEY=%s\nHIT=%s\n' "$KEY" "$HIT" > "$RUNNER_TEMP/metro-cache-${{ inputs.scope }}.env"
    - uses: ./.github/actions/cache-summary
      if: ${{ inputs.mode == 'restore' }}
      with:
        layer: metro-${{ inputs.scope }}-${{ inputs.suffix }}
        hit: ${{ steps.restore.outputs.cache-hit }}
        matched-key: ${{ steps.restore.outputs.cache-matched-key }}
        paths: frontend/mla-tamagui/node_modules/.cache/app-build
    - name: Decide the save
      id: decide
      if: ${{ inputs.mode == 'save' }}
      shell: bash
      run: |
        f="$RUNNER_TEMP/metro-cache-${{ inputs.scope }}.env"
        save=false
        if [ -f "$f" ]; then
          . "$f"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          [ "$HIT" = true ] || [ ! -d frontend/mla-tamagui/node_modules/.cache/app-build ] || save=true
        fi
        echo "save=$save" >> "$GITHUB_OUTPUT"
        mb=$(du -sm frontend/mla-tamagui/node_modules/.cache/app-build 2>/dev/null | cut -f1 || true)
        echo "- **metro-${{ inputs.scope }}** ($GITHUB_JOB) before save: ${mb:-0} MB, $([ "$save" = true ] && echo saving || echo "not saving (exact key hit or nothing built)")" >> "$GITHUB_STEP_SUMMARY"
    - name: Save the app build state
      if: ${{ inputs.mode == 'save' && steps.decide.outputs.save == 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: frontend/mla-tamagui/node_modules/.cache/app-build
        key: ${{ steps.decide.outputs.key }}
