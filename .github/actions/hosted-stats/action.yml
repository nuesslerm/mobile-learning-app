name: Hosted stats
description: >-
  The two ends of a GitHub-hosted job's runner sampling (the hosted flavor of pipeline.yml): `start` runs the sampler beside the job, `upload` (the job's last
  step, `if: always()`) hands the samples to the report job as the artifact `stats-<job>`.
inputs:
  mode:
    description: start or upload
    required: true
  job:
    description: The job's name (the file and artifact name)
    required: true
runs:
  using: composite
  steps:
    - name: Start the runner sampler
      if: ${{ inputs.mode == 'start' }}
      shell: bash
      env:
        STATS_FILE: ${{ runner.temp }}/runner-stats/stats-${{ inputs.job }}.jsonl
      run: |
        mkdir -p "$(dirname "$STATS_FILE")"
        # the runner kills what still carries the step's tracking id when the step ends, which setsid does not clear
        env -u RUNNER_TRACKING_ID setsid nohup bash "${{ github.action_path }}/../hosted-setup/sampler.sh" "$STATS_FILE" > /dev/null 2>&1 &
    # a job that went red says so at once (`wf ci failed --notify`): the failed step as a Better Stack log line (ci.job.failed), a refreshed run comment and the
    # failure hook, while the rest of the run still goes; best effort, never a second failure (the Actions API shows a step's result at once, a job's log only when it ends)
    - name: Report the failure now
      # always(): failure() inside a composite action sees only this action's own steps, so the script asks the API whether a step of the job is red
      if: ${{ inputs.mode == 'upload' && always() }}
      shell: bash
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        command -v wf > /dev/null || exit 0
        # `wf ci failed` sends the ci.job.failed log line, refreshes the run comment and posts to CI_FAILURE_HOOK_URL itself
        out=$(timeout 120 wf ci failed --notify 2>/dev/null) || true
        [ "$(jq -r '(.failed_steps // []) | length' <<<"$out" 2>/dev/null || echo 0)" -gt 0 ] || exit 0
        echo "$out"
        step=$(jq -r '.failed_steps[0] // ""' <<<"$out" 2>/dev/null)
        job=$(jq -r '.job // "${{ inputs.job }}"' <<<"$out" 2>/dev/null)
        # an error annotation too: whether the API shows it while the job runs is told by the `annotations` count the next red job reports
        echo "::error title=ci.job.failed::$job: $step"
    - name: Upload the runner samples
      if: ${{ inputs.mode == 'upload' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: stats-${{ inputs.job }}
        path: ${{ runner.temp }}/runner-stats/stats-${{ inputs.job }}.jsonl
        retention-days: 1
        if-no-files-found: ignore
    # the rows the job's wf commands kept for the CI database (wf ci db); the report job merges them into the sealed one
    - name: Upload the job's CI database rows
      if: ${{ inputs.mode == 'upload' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-db-${{ inputs.job }}
        path: ${{ runner.temp }}/wf-ci-db/rows.sqlite
        retention-days: 1
        if-no-files-found: ignore
