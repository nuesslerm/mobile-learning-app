name: Install wf
description: >-
  A static (musl) `wf` built from clis/ with the deploy profile, installed once per clis/ tree into the runner tool cache
  beside the binaries it runs for `wf t3` and `wf exec`, and put on PATH. A job whose clis/ tree is already installed builds nothing.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/../../wf-cargo-target
        CARGO_PROFILE_DEPLOY_INCREMENTAL: "true"
      run: |
        tree=$(git rev-parse HEAD:clis)
        # no package ships a wf bin any more; one left in node_modules would shadow this wf inside pnpm run
        rm -f node_modules/.bin/wf
        root=$RUNNER_TOOL_CACHE/clis; sudo=$([ "$(id -u)" = 0 ] || echo sudo)
        dir=$root/$tree
        # wf runs `t3`, `exec` and `mimic` as the binaries beside it (clis/wf/src/external.rs); each is also its package's name
        bins="t3-serve rca-exec wf-mimic wf"
        complete=true; for bin in $bins; do [ -x "$dir/$bin" ] || complete=false; done
        if [ "$complete" = false ]; then
          target=$(uname -m)-unknown-linux-musl
          # a cancelled job can stop an install half way; finish it first, or every later apt-get refuses to run
          { command -v cc && command -v musl-gcc; } >/dev/null || $sudo dpkg --configure -a
          command -v cc >/dev/null || { $sudo apt-get update -qq && $sudo apt-get install -y -qq build-essential; }
          command -v musl-gcc >/dev/null || { $sudo apt-get update -qq && $sudo apt-get install -y -qq musl-tools; }
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          cargo --version >/dev/null 2>&1 || { rustup toolchain uninstall "$pin" || true; rustup toolchain install --profile minimal; }
          rustup target add "$target" >/dev/null
          # the clis/ tree, not the commit, so a commit that leaves clis/ alone neither rebuilds nor reinstalls
          export WF_BUILD_SHA=$tree "CC_${target//-/_}=musl-gcc"
          packages=(); for bin in $bins; do packages+=(-p "$bin"); done
          (cd clis && cargo build --profile deploy "${packages[@]}" --target "$target")
          mkdir -p "$root" && tmp=$(mktemp -d "$root/.new-XXXXXX")
          for bin in $bins; do cp "$CARGO_TARGET_DIR/$target/deploy/$bin" "$tmp/$bin" && chmod 755 "$tmp/$bin"; done
          chmod 755 "$tmp"
          # a tree installed before a binary joined the list holds wf alone
          rm -rf "$dir"
          mv -T "$tmp" "$dir" 2>/dev/null || rm -rf "$tmp"
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "wf $tree at $dir"
