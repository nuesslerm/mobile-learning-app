name: Hosted setup
description: >-
  What a test job of the GitHub-hosted flavor of the CI (pipeline.yml, called by ci-hosted.yml) needs before its own steps: the tailnet (the private cargo registry), node
  and pnpm, the Rust toolchain, bws, and the `wf` the job `wf` built, put on PATH. The caller has checked the repository out.
inputs:
  ts-client-id:
    description: The hosted-join Tailscale OAuth client id
    required: true
  ts-secret:
    description: Its secret
    required: true
  job:
    description: The job's name (the runner sampler's file name)
    required: true
  install:
    description: Fill the pnpm store from the bucket and run pnpm install
    default: "true"
  save-pnpm:
    description: Save the pnpm store to the GitHub Actions cache after the install when the restore did not hit the exact key (one job of the run does)
    default: "false"
  clis-artifact:
    description: The artifact holding the binaries (clis for x64, clis-arm for an arm64 runner)
    default: clis
  keep-android:
    description: Keep the Android SDK the hosted image carries (the Android e2e job boots its emulator from it)
    default: "false"
runs:
  using: composite
  steps:
    - name: Free the runner's disk in the background
      shell: bash
      env:
        KEEP_ANDROID: ${{ inputs.keep-android }}
      run: |
        # a cold debug build of the workspace's crates fills the 14 GB a hosted runner has free ("No space left on device" in a flow shard)
        (sudo rm -rf /usr/share/dotnet $([ "$KEEP_ANDROID" = true ] || echo /usr/local/lib/android) /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift >/dev/null 2>&1 &)
        df -h / | tail -1
    - name: Join the tailnet as tag:ci-gh-hosted
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
      with:
        oauth-client-id: ${{ inputs.ts-client-id }}
        oauth-secret: ${{ inputs.ts-secret }}
        tags: tag:ci-gh-hosted
        use-cache: 'false'
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.22.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
    - uses: ./.github/actions/install-bws
    - name: Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.clis-artifact }}
        path: ${{ runner.temp }}/clis-bin
    - name: wf and its sibling binaries on PATH
      shell: bash
      run: |
        chmod +x "$RUNNER_TEMP"/clis-bin/*
        echo "$RUNNER_TEMP/clis-bin" >> "$GITHUB_PATH"
    - uses: ./.github/actions/hosted-stats
      with:
        mode: start
        job: ${{ inputs.job }}
    - name: Update the live comment on the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: PATH="$RUNNER_TEMP/clis-bin:$PATH" wf ci live >/dev/null 2>&1 || true
    - name: Where the pnpm store is
      id: pnpm-store
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore the pnpm store
      id: pnpm-cache
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-
    - uses: ./.github/actions/cache-summary
      if: ${{ inputs.install == 'true' }}
      with:
        layer: pnpm
        hit: ${{ steps.pnpm-cache.outputs.cache-hit }}
        matched-key: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
        paths: ${{ steps.pnpm-store.outputs.path }}
    - name: pnpm install
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Save the pnpm store
      if: ${{ inputs.install == 'true' && inputs.save-pnpm == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
