name: CI

# MANUAL ONLY (2026-09-03). Nothing in this repo runs on push or pull_request
# any more: the per-commit gate is lefthook's pre-commit (lint, affected
# typecheck, affected unit tests, the simplicity budget), which runs on every
# local commit, including the one-unit commits the git-state worker lands.
# This workflow exists for an explicit, human-chosen run of the expensive
# tier (lint/test/build of every package changed since origin/dev and its dependents) from the Actions UI or
# `wf ci`. Decision log: docs/audits/2026-09-02-token-diet-decision-log.md, 33.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  AFFECTED: "...[origin/dev]"

# A newer commit makes an in-flight run irrelevant. Without this, pushing three
# times in a row bills three full runs and only the last one matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks (lint)
    # Evaluated by GitHub's orchestrator before a runner is ever requested --
    # costs no Actions minutes, and is what lets this job show as SKIPPED
    # instead of FAILED once the account's minutes are exhausted for the
    # month. See .github/workflows/ci-budget.yml for what sets/clears this.
    if: vars.CI_BUDGET_LOW != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Not --ignore-scripts: postinstall builds the workspace CLIs that the
      # eslint config and its plugin resolve through dist/, so skipping it trades
      # a couple of minutes for a lint run that cannot load its own rules.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "$AFFECTED" run --if-present lint

      # Last step -- pre-emptively flips CI_BUDGET_LOW=true when this month's
      # consumed minutes are within 100 of the budget. See
      # .github/actions/check-ci-budget/action.yml for why a per-repo proxy
      # rather than the user-billing API. `if: always()` so the flip still
      # lands when the lint itself failed -- that is exactly the case where
      # the next several runs would otherwise burn the last sliver.
      - name: Check CI budget and flip flag if low
        if: always()
        uses: ./.github/actions/check-ci-budget

  full:
    name: Full (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "$AFFECTED" run --if-present lint
      - run: pnpm --filter "$AFFECTED" run --if-present test
      - run: pnpm --filter "$AFFECTED" run --if-present build

      # Same pre-emptive CI_BUDGET_LOW flip as the fast job above. The full
      # job is the expensive one (~30 min) so a flip here saves the most
      # budget at month-end -- see the fast job's identical step for the
      # full rationale and the action's own doc comment for the design.
      - name: Check CI budget and flip flag if low
        if: always()
        uses: ./.github/actions/check-ci-budget
