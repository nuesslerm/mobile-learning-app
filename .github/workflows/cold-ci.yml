name: Cold CI

# The weekly cold run: pipeline.yml with every test planned (`services: all`) and no Nx or layer cache (`fresh`), so a cache that
# hides a break is found within a week. It deploys, ships and runs no device suite. GitHub starts a schedule hours late and only from the default branch, so a scheduled run tests `main`, which is `dev` merged; a dispatch on `dev` tests `dev`.
on:
  schedule:
    - cron: '37 3 * * 0'
  workflow_dispatch:

concurrency:
  group: cold-ci
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pipeline.yml
    with:
      runner: '"ubuntu-24.04"'
      deploy_runner: '"ubuntu-24.04-arm"'
      shards: ${{ fromJSON(vars.HOSTED_SHARDS || '6') }}
      ship: false
      deploy: false
      e2e: false
      label: Cold CI
      fresh: true
      services: all
    secrets:
      BWS_CI_DEPLOY_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
      TS_HOSTED_OAUTH_CLIENT_ID: ${{ secrets.TS_HOSTED_OAUTH_CLIENT_ID }}
      TS_HOSTED_OAUTH_CLIENT_SECRET: ${{ secrets.TS_HOSTED_OAUTH_CLIENT_SECRET }}
