name: CI audit

# The audit of CI on dev (`wf ci audit`, thresholds in .github/ci-audit.json, procedure docs/runbooks/nightly-audit.md): the runs of the last 24 hours
# of deploy.yml and ci-hosted.yml judged for waste (VM CPU-seconds, cache health, the pnpm store, the Nx hit ratio, hash drift, waits and idle gaps).
# The weekly run (and a dispatch with replay=true) also replays the two package test stages on dev's head through the Nx cache and with --fresh: a kind
# that passes cached and fails fresh is a stale or poisoned entry, so the cache moves to a new generation (`wf cache purge nx`). The job prints one JSON verdict
# (schema in `wf ci audit --help`), uploads it as the artifact ci-audit.json and never fails on a finding: the nightly Claude clock reads it.
#
# WHEN. Daily 02:23 UTC and Sundays 03:37 UTC, on a GitHub-hosted runner. GitHub starts a schedule hours late and only from the default branch, so nothing
# here is live until dev is merged to main; this job audits dev either way. Dispatch by hand, or scheduled-triggers.yml for an EMPTY commit tagged [ci-audit].
on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      since:
        description: 'Audit the runs that started at or after this epoch time (default: the last 24 hours)'
        required: false
        default: ''
      replay:
        description: 'Also replay the two package test stages cached and fresh (the weekly run always does)'
        type: boolean
        required: false
        default: false
      message:
        description: 'Commit message that started this run (set by scheduled-triggers.yml)'
        type: string
        required: false
        default: ''
      sha:
        description: 'Commit sha that started this run (set by scheduled-triggers.yml)'
        type: string
        required: false
        default: ''

concurrency:
  group: ci-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: audit
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: ${{ fromJSON(vars.RUNNER_TAG_CI_AUDIT || '["ubuntu-24.04"]') }}
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      BWS_SERVER_URL: https://vault.bitwarden.eu
      WF_TAILNET_SOCKS: ''
    steps:
      - name: Does this run replay the Nx cache
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REPLAY: ${{ github.event.inputs.replay }}
        run: |
          replay=false
          if [ "$SCHEDULE" = '37 3 * * 0' ] || [ "$REPLAY" = true ]; then replay=true; fi
          echo "replay=$replay" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.mode.outputs.replay == 'true' }}
        with:
          node-version: 22.22.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.mode.outputs.replay == 'true' }}
        with:
          run_install: false
      - name: Join the tailnet as tag:ci-gh-hosted
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_HOSTED_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_HOSTED_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-gh-hosted
          use-cache: 'false'
      - uses: ./.github/actions/install-bws
      - uses: ./.github/actions/build-wf
        with:
          flavor: hosted
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.mode.outputs.replay == 'true' }}
        timeout-minutes: 10
      - name: Audit the runs of the last day
        env:
          SECRETS_BACKEND: bitwarden
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BWS_CI_DEPLOY_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-audit" "$RUNNER_TEMP/audit"
          wf ci audit ${SINCE:+--since "$SINCE"} > "$RUNNER_TEMP/ci-audit/ci-audit.json"
          jq -c '{ok, runs: (.runs | length), findings: (.findings | length)}' "$RUNNER_TEMP/ci-audit/ci-audit.json"
      # The Nx cache replay check: what the toolchain below needs is what the package tests need.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.mode.outputs.replay == 'true' }}
      - run: pnpm --filter @lib/browser-client exec playwright install --with-deps chromium
        if: ${{ steps.mode.outputs.replay == 'true' }}
        timeout-minutes: 5
      # the selector flow test runs Android's UiSelector patterns through Java's own regex engine
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: ${{ steps.mode.outputs.replay == 'true' }}
        with:
          distribution: temurin
          java-version: 21
      - name: Rust toolchain on PATH
        if: ${{ steps.mode.outputs.replay == 'true' }}
        run: |
          [ -x "$HOME/.cargo/bin/cargo" ] || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          cargo --version >/dev/null 2>&1 || { rustup toolchain uninstall "$pin" || true; rustup toolchain install --profile minimal; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Nx hashes `node --version` and `pnpm --version`: a step on other versions than mise.toml pins audits entries nobody replays.
      - name: Toolchain is the pinned one
        if: ${{ steps.mode.outputs.replay == 'true' }}
        run: wf test drift --pins
      - name: Every package test of dev's head
        if: ${{ steps.mode.outputs.replay == 'true' }}
        run: |
          out="$RUNNER_TEMP/audit"
          date +%s > "$out/started"
          wf test plan --all --sha "$(git rev-parse HEAD)" --json > "$out/plan.json"
          jq -r '.stages | to_entries[] | select(.key == "flow-tests" or .key == "typecheck-lint-unit-tests") | "\(.key): \(.value | length) test(s)"' "$out/plan.json"
      # Once through the cache (a replay where an entry exists), once with --fresh. Each prints {ok, stage, kinds:[{kind, projects, verdict}]}.
      - name: Both stages, cached and fresh
        if: ${{ steps.mode.outputs.replay == 'true' }}
        timeout-minutes: 100
        env:
          SECRETS_BACKEND: bitwarden
          BWS_CI_DEPLOY_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
        run: |
          out="$RUNNER_TEMP/audit"
          for stage in flow-tests typecheck-lint-unit-tests; do
            wf test run --stage "$stage" --plan "$out/plan.json" --parallel 2 > "$out/$stage.cached.json" || true
            wf test run --stage "$stage" --plan "$out/plan.json" --parallel 2 --fresh > "$out/$stage.fresh.json" || true
          done
      # A kind that passed cached and did not pass fresh. A stage whose fresh run printed no kinds did not run: that is a finding too.
      - name: Compare, kind by kind
        if: ${{ steps.mode.outputs.replay == 'true' }}
        id: compare
        run: |
          out="$RUNNER_TEMP/audit"
          : > "$out/poisoned.txt"
          for stage in flow-tests typecheck-lint-unit-tests; do
            if ! jq -e '.kinds' "$out/$stage.fresh.json" > /dev/null 2>&1; then
              echo "$stage: the --fresh run printed no kinds ($(head -c 300 "$out/$stage.fresh.json"))" >> "$out/poisoned.txt"
              continue
            fi
            jq -r -n --arg stage "$stage" --slurpfile c "$out/$stage.cached.json" --slurpfile f "$out/$stage.fresh.json" '
              ($f[0].kinds // []) as $fresh
              | ($c[0].kinds // [])[] | select(.verdict == "pass") as $k
              | select((($fresh | map(select(.kind == $k.kind)) | .[0].verdict) // "missing") != "pass")
              | "\($stage) \($k.kind): passed through the cache, not fresh (\($k.projects | join(", ")))"' >> "$out/poisoned.txt"
          done
          started=$(cat "$out/started"); now=$(date +%s)
          verdict=pass; [ ! -s "$out/poisoned.txt" ] || verdict=fail
          jq -n --arg verdict "$verdict" --arg sha "$(git rev-parse HEAD)" --arg dir "$out" --argjson started "$((started * 1000))" --argjson finished "$((now * 1000))" \
            --arg message "$(head -c 400 "$out/poisoned.txt")" '{
              schema: 1, verdict: $verdict, ok: ($verdict == "pass"), exitCode: (if $verdict == "pass" then 0 else 1 end),
              message: (if $verdict == "pass" then null else $message end), script: "nx-cache-audit", platform: "integration", sha: $sha,
              startedMs: $started, finishedMs: $finished, started: ($started / 1000 | todate), finished: ($finished / 1000 | todate),
              durationS: (($finished - $started) / 1000), recordDir: $dir, warnings: []
            }' > "$out/report.json"
          cat "$out/poisoned.txt"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
      - name: Purge the Nx cache
        if: ${{ steps.compare.outputs.verdict == 'fail' }}
        env:
          SECRETS_BACKEND: bitwarden
          BWS_CI_DEPLOY_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
        run: wf cache purge nx
      - name: Publish the replay check's run bundle
        if: ${{ !cancelled() && steps.mode.outputs.replay == 'true' }}
        timeout-minutes: 5
        env:
          SECRETS_BACKEND: bitwarden
          BWS_CI_DEPLOY_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
        run: |
          [ -f "$RUNNER_TEMP/audit/report.json" ] || { echo "no replay report: the run stopped before the comparison"; exit 0; }
          rm -f "$RUNNER_TEMP/audit/started"
          WF_SITE=ci wf test publish "$RUNNER_TEMP/audit"
      # One verdict: the replay check's lines join the findings, then the summary and the artifact.
      - name: The verdict
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/ci-audit/ci-audit.json"
          [ -s "$f" ] || echo '{"schema":1,"ok":null,"reason":"wf ci audit printed nothing","findings":[]}' > "$f"
          if [ -s "$RUNNER_TEMP/audit/poisoned.txt" ]; then
            next='The Nx cache served a pass that fails fresh and was moved to a new generation (wf cache purge nx). Find the nondeterministic test or the input missing from its key, fix it through the normal gate; a flaky test costs one cold run.'
            jq --rawfile lines "$RUNNER_TEMP/audit/poisoned.txt" --arg next "$next" '
              .findings += [$lines | split("\n") | map(select(length > 0))[] | {kind: "cache-poisoned", run: null, subject: ., hard: true, wasteSeconds: 0, message: ., next: $next}] | .ok = false' "$f" > "$f.new" && mv "$f.new" "$f"
          fi
          {
            echo "### CI audit"
            jq -r '"\(.findings | length) finding(s) over \(.runs | length) run(s)", (.findings[] | "- **\(.kind)** \(.subject): \(.message) -- next: \(.next)")' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: ci-audit
          path: ${{ runner.temp }}/ci-audit/ci-audit.json
          retention-days: 14
          if-no-files-found: ignore
