name: Scheduled triggers

# The one workflow that listens to a push for the runs a commit tag asks for. A Claude scheduled task pushes an EMPTY commit to dev whose message carries
# a tag ([vm-state-backup], [parity], [ci-audit], ...), for the runs a schedule cannot start (GitHub starts its own `schedule` hours late, and only from main). This job is skipped
# at once (no runner) on every push that carries no tag, so the pull request lists one skipped check instead of one per workflow; on a tagged push it
# checks that the commit changed no file and starts the workflow the tag names (each of them takes `message` and `sha` as dispatch inputs and only runs on dev).
# deploy.yml starts only when a push changes a file, so an empty commit starts no CI run and cannot displace a waiting one.
on:
  push:
    branches: [dev]

permissions: {}

jobs:
  route:
    permissions:
      actions: write
      contents: read
    # a marker is the start of the message or of a line, like the parsers of `wf mimic trigger` and `wf parity track plan` read it; fromJSON gives the newline
    if: >-
      ${{
        contains(github.event.head_commit.message, '[ci-audit]') ||
        startsWith(github.event.head_commit.message, '[hosted-minutes ') ||
        startsWith(github.event.head_commit.message, '[hosted-tailnet]') ||
        startsWith(github.event.head_commit.message, '[parity]') ||
        startsWith(github.event.head_commit.message, '[record ') ||
        startsWith(github.event.head_commit.message, '[replay ') ||
        contains(github.event.head_commit.message, format('{0}[record ', fromJSON('"\n"'))) ||
        contains(github.event.head_commit.message, format('{0}[replay ', fromJSON('"\n"'))) ||
        contains(github.event.head_commit.message, '[gem-sync') ||
        startsWith(github.event.head_commit.message, '[track ') ||
        contains(github.event.head_commit.message, format('{0}[track ', fromJSON('"\n"'))) ||
        contains(github.event.head_commit.message, '[vm-state-backup]')
      }}
    name: Start the workflow the commit tag names
    runs-on: ${{ fromJSON(vars.RUNNER_TAG_GATE_GATE || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Count the files the commit changed
        id: empty
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" | jq '.files | length')
          echo "the commit $GITHUB_SHA changes $files file(s)"
          if [ "$files" = 0 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::a commit that asks for a run with a tag must be empty; this one changes $files file(s), so nothing was started"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch each workflow the tags name
        if: ${{ steps.empty.outputs.go == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first=$(printf '%s\n' "$MESSAGE" | head -1)
          anywhere() { printf '%s' "$MESSAGE" | grep -qF -- "$1"; }
          atstart() { case "$first" in "$1"*) return 0 ;; esac; return 1; }
          online() { printf '%s\n' "$MESSAGE" | grep -qE -- "^$1"; }
          started=0
          start() {
            body=$(jq -cn --arg message "$MESSAGE" --arg sha "$GITHUB_SHA" --argjson extra "${2:-{\}}" '{ref: "dev", inputs: ({message: $message, sha: $sha} + $extra)}')
            curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -d "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$1/dispatches" \
              && echo "started $1" && started=$((started + 1)) \
              || echo "::error::could not start $1"
          }
          ! anywhere '[ci-audit]' || start ci-audit.yml
          if atstart '[hosted-minutes '; then
            if anywhere arm64; then start hosted-minutes.yml '{"runner":"ubuntu-24.04-arm"}'; else start hosted-minutes.yml; fi
          fi
          ! atstart '[hosted-tailnet]' || start hosted-tailnet.yml
          ! atstart '[parity]' || start parity.yml
          if online '\[record ' || online '\[replay '; then start record-references.yml; fi
          ! anywhere '[gem-sync' || start repomix-gemini-context.yml
          ! online '\[track ' || start track-contracts.yml
          ! anywhere '[vm-state-backup]' || start vm-state-backup.yml
          echo "$started workflow(s) started"
