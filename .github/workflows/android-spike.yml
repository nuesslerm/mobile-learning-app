name: Android emulator spike

# Proves what a GitHub-hosted runner can do for the Android e2e stage before any harness code depends on it: KVM, the emulator boot, adb root, the
# nat table the network stubs use, the emulator's route to the host, and Expo Go on the x86_64 image. No secrets, no tailnet, one runner. It runs
# when this file changes, so a spike run is a push of this file; delete the file once the hosted Android stage is in pipeline.yml.
on:
  push:
    branches: [dev]
    paths: [.github/workflows/android-spike.yml]

permissions: {}

concurrency:
  group: android-spike
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: What the runner has
        run: |
          nproc; free -m; df -h /
          ls -l /dev/kvm || echo "no /dev/kvm yet"
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME"
          du -sh "$ANDROID_HOME"/* 2>/dev/null || true
          java -version 2>&1 | head -1
      - name: Let every user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Libraries the emulator binary links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3 libxkbcommon0 libgl1
      - name: Install the emulator and the system image
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          set -o pipefail
          t0=$(date +%s)
          sdkmanager --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" | tail -5
          echo "sdk install seconds: $(( $(date +%s) - t0 ))"
          df -h / | tail -1
          emulator -version | head -2
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Create the device
        run: |
          avdmanager create avd -n wf -k "system-images;android-34;google_apis;x86_64" -d pixel_2 --force
          ini="$HOME/.android/avd/wf.avd/config.ini"
          for kv in hw.lcd.width=480 hw.lcd.height=1040 hw.lcd.density=213 hw.ramSize=3072 disk.dataPartition.size=2G; do
            key="${kv%%=*}"; sed -i "/^$key=/d" "$ini"; echo "$kv" >> "$ini"
          done
          grep -E "hw.lcd|hw.ramSize|dataPartition|abi.type|image.sysdir" "$ini"
      - name: Boot it and time each phase
        run: |
          t0=$(date +%s)
          nohup emulator -avd wf -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect -accel on -cores 2 -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          echo "device seen after $(( $(date +%s) - t0 )) s"
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do
            sleep 3
            if [ $(( $(date +%s) - t0 )) -gt 900 ]; then echo "no boot after 900 s"; tail -30 "$RUNNER_TEMP/emulator.log"; exit 1; fi
          done
          echo "boot_completed after $(( $(date +%s) - t0 )) s"
          tail -5 "$RUNNER_TEMP/emulator.log"
      - name: What the harness needs from the device
        run: |
          adb root; sleep 3; adb wait-for-device
          adb shell id
          adb shell wm size 480x1040; adb shell wm density 213; adb shell wm size; adb shell wm density
          for p in ro.product.name ro.build.type ro.product.cpu.abi ro.build.version.sdk net.dns1; do echo "$p=$(adb shell getprop $p | tr -d '\r')"; done
          echo "--- nat table (the network stubs are DNAT rules)"
          adb shell 'iptables -t nat -L OUTPUT -n 2>&1 | head -5' || true
          echo "--- route to the host the stub server would listen on"
          adb shell 'ping -c 1 -W 3 10.0.2.2 2>&1 | tail -2' || true
          echo "--- activity service and packages"
          adb shell 'service check activity; pm list packages | wc -l'
      - name: Expo Go on this image
        run: |
          curl -fsSL -o "$RUNNER_TEMP/expo-go.apk" "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-57.0.9/Expo-Go-57.0.9.apk"
          ls -l "$RUNNER_TEMP/expo-go.apk"
          echo "--- native libraries in the apk (the image is x86_64)"
          unzip -l "$RUNNER_TEMP/expo-go.apk" | grep -oE "lib/[a-z0-9_-]+/" | sort | uniq -c
          adb install -r "$RUNNER_TEMP/expo-go.apk"
          adb shell monkey -p host.exp.exponent -c android.intent.category.LAUNCHER 1 | tail -1
          sleep 15
          adb shell dumpsys activity activities | grep -m3 -E "mResumedActivity|topResumedActivity" || true
          adb exec-out screencap -p > "$RUNNER_TEMP/expo-go.png"
          ls -l "$RUNNER_TEMP/expo-go.png"
      - name: Audio, for the voice unit
        run: |
          adb shell dumpsys media.audio_flinger 2>&1 | head -5 || true
          adb shell 'pm grant host.exp.exponent android.permission.RECORD_AUDIO && echo record-audio-granted' || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-spike
          path: |
            ${{ runner.temp }}/expo-go.png
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
