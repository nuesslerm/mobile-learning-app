name: Tailscale auth-key expiry watch

# Tailscale caps auth keys at 90 days, and expiry breaks the NEXT node join
# rather than any running node — so it fails silently, and you discover it
# mid-rebuild, which is the worst possible moment.
#
# This is WATCH-ONLY on purpose. Listing keys is a read, so it needs only the
# gh-ci credential CI already holds — no vault write token, no privilege
# increase. It yells; a human runs `wf vm net auth-key rotate --apply`.
# That is the whole reason the rotation itself is not automated here: automating
# it would mean giving CI write access to the deploy vault project, which is a
# real escalation for a watch.
#
# Runs by hand (Actions, Run workflow) or by scheduled-triggers.yml (dispatch) on an EMPTY commit to dev
# tagged [ts-key-watch], never by 'push' itself: a Claude scheduled task ("Tailscale key watch clock") pushes
# it weekly, because GitHub starts scheduled runs hours late in this private repo. The warning window is 14
# days, so a late or missed run still leaves room.
#
# NOTE: it can only see keys the TS_VM_OAUTH client itself created. A key made by
# hand in the admin console is invisible to the API, and this reports that as
# "expiry UNKNOWN + rotation needed" rather than a false all-clear — because an
# unknowable expiry is exactly the silent failure being guarded against.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message that triggered this run (set by scheduled-triggers.yml)'
        type: string
        required: false
        default: ''
      sha:
        description: 'Commit sha that triggered this run (set by scheduled-triggers.yml)'
        type: string
        required: false
        default: ''
      warn_days:
        description: 'Days-remaining threshold (default 14)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Check TS_VM_AUTH_KEY expiry
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/install-wf

      - name: Resolve Tailscale credentials from Bitwarden
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21 # v2
        with:
          access_token: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          api_url: https://vault.bitwarden.eu/api
          identity_url: https://vault.bitwarden.eu/identity
          secrets: |
            8869f954-47e1-4759-b101-b4fd00af9640 > TS_TAILNET_ID
            58f92d7b-87c0-444e-be2f-b4fd00af96ec > TS_VM_OAUTH_CLIENT_ID
            e4633ebc-26a1-4879-b471-b4fd00af9792 > TS_VM_OAUTH_CLIENT_SECRET

      - name: Check expiry
        id: check
        env:
          SECRETS_BACKEND: bitwarden
          BWS_SERVER_URL: https://vault.bitwarden.eu
          # The gh-ci token, which is READ-only. Deliberately no edit token here.
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_CI_DEPLOY_ACCESS_TOKEN }}
          TS_TAILNET_ID: ${{ env.TS_TAILNET_ID }}
          TS_VM_OAUTH_CLIENT_ID: ${{ env.TS_VM_OAUTH_CLIENT_ID }}
          TS_VM_OAUTH_CLIENT_SECRET: ${{ env.TS_VM_OAUTH_CLIENT_SECRET }}
          WARN_DAYS: ${{ inputs.warn_days }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${WARN_DAYS:-}" ]; then ARGS="--warn-days ${WARN_DAYS}"; fi
          # The command's exit code IS the alarm, so capture output for the
          # summary and re-raise it rather than letting `set -e` swallow context.
          # shellcheck disable=SC2086
          if wf vm net auth-key-status $ARGS 2>&1 | tee /tmp/expiry.txt; then
            echo "needs_rotation=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rotation=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          # The single quotes below are deliberate: these lines are markdown for
          # the job summary, so the backticks must reach it literally rather than
          # being run as command substitution.
          # shellcheck disable=SC2016
          {
            if [ "${{ steps.check.outputs.needs_rotation }}" = "true" ]; then
              echo "### ⚠️ TS_VM_AUTH_KEY needs rotation"
              echo ""
              echo 'Run: `wf vm net auth-key rotate --apply`'
            else
              echo "### ✅ TS_VM_AUTH_KEY is healthy"
            fi
            echo ""
            echo '```'
            cat /tmp/expiry.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when rotation is due
        if: steps.check.outputs.needs_rotation == 'true'
        run: |
          echo "TS_VM_AUTH_KEY needs rotation — see the job summary." >&2
          exit 1
