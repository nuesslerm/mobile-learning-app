# How a runner provisions the Orca reference for `wf mimic record` (`wf mimic capture --help` documents the schema): the commit the pin names,
# built the way docs/runbooks/record-reference-servers-on-the-vm.md section 1 says. The Orca Provisioner (src/orca/orcad.ts) refuses a checkout
# that is not at the pin.
workdir = "orca"

[toolchain]
node = "24"
rust = "stable"

[source]
repo = "https://github.com/stablyai/orca"
pin = "../../orca-conformance/orca-pin.json"
commit_pointer = "/commit"

[env]
MIMIC_ORCA_ROOT = "{source}"
ORCA_ORCAD_CHECKOUT = "{source}"
MIMIC_CLI_DIR = "{work}/scripted-clis"

[[step]]
name = "orca-install"
run = ["pnpm", "install", "--frozen-lockfile"]
timeout_minutes = 45

[[step]]
name = "orca-mobile-install"
run = ["pnpm", "-C", "mobile", "install", "--frozen-lockfile"]
timeout_minutes = 45

[[step]]
name = "build-mobile-web"
run = ["pnpm", "run", "build:mobile-web"]
timeout_minutes = 45

[[step]]
name = "build-orcad"
run = ["pnpm", "run", "build:orcad"]
timeout_minutes = 45

# The scripted agent CLIs both sides see (docs/plans mimic decision 5): exec-testkit's `scripted-cli` under the names `claude`, `codex` and `opencode`.
[[step]]
name = "build-scripted-cli"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "libraries/agent-api/Cargo.toml", "--target-dir", "{work}/scripted-target", "-p", "exec-testkit", "--bin", "scripted-cli"]
timeout_minutes = 45

[[step]]
name = "scripted-cli-dir"
cwd = "{work}"
run = ["mkdir", "-p", "scripted-clis"]

[[step]]
name = "scripted-cli-claude"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/claude"]

[[step]]
name = "scripted-cli-codex"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/codex"]

[[step]]
name = "scripted-cli-opencode"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/opencode"]

# A replay's candidate is the chain the integration tests replay against (orca-serve over rca-service and rca-exec, with the scripted CLIs): the `launch` of
# the sets' [candidate.orca-serve] starts `chain-bin/chain` (clis/orca-serve/examples/chain.rs, the same rig as tests/integration) over these binaries.
[[step]]
name = "build-chain"
when = "replay"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "clis/Cargo.toml", "--target-dir", "{work}/chain-target", "-p", "orca-serve", "--bin", "orca-serve", "--example", "chain"]
timeout_minutes = 60

[[step]]
name = "build-chain-exec"
when = "replay"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "clis/Cargo.toml", "--target-dir", "{work}/chain-target", "-p", "rca-exec", "--bin", "rca-exec"]
timeout_minutes = 45

[[step]]
name = "build-chain-service"
when = "replay"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "backend/remote-chat-agent/Cargo.toml", "--target-dir", "{work}/service-target", "-p", "rca-service", "--bin", "rca-service"]
timeout_minutes = 90

[[step]]
name = "build-chain-cli"
when = "replay"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "libraries/agent-api/Cargo.toml", "--target-dir", "{work}/scripted-target", "-p", "exec-testkit", "--bin", "scripted-cli"]
timeout_minutes = 45

[[step]]
name = "chain-bin-dir"
when = "replay"
cwd = "{work}"
run = ["mkdir", "-p", "chain-bin"]

[[step]]
name = "chain-bin-chain"
when = "replay"
cwd = "{work}"
run = ["cp", "chain-target/debug/examples/chain", "chain-bin/chain"]

[[step]]
name = "chain-bin-orca-serve"
when = "replay"
cwd = "{work}"
run = ["cp", "chain-target/debug/orca-serve", "chain-bin/orca-serve"]

[[step]]
name = "chain-bin-rca-exec"
when = "replay"
cwd = "{work}"
run = ["cp", "chain-target/debug/rca-exec", "chain-bin/rca-exec"]

[[step]]
name = "chain-bin-rca-service"
when = "replay"
cwd = "{work}"
run = ["cp", "service-target/debug/rca-service", "chain-bin/rca-service"]

[[step]]
name = "chain-bin-scripted-cli"
when = "replay"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "chain-bin/scripted-cli"]
