# How a runner provisions the Orca reference for `wf mimic record` (`wf mimic provision --help` documents the schema): the commit the pin names,
# built the way docs/runbooks/record-reference-servers-on-the-vm.md section 1 says. The Orca Provisioner (src/orca/orcad.ts) refuses a checkout
# that is not at the pin.
workdir = "orca"

[toolchain]
node = "24"
rust = "stable"

[source]
repo = "https://github.com/stablyai/orca"
pin = "../../orca-conformance/orca-pin.json"
commit_pointer = "/commit"

[env]
MIMIC_ORCA_ROOT = "{source}"
ORCA_ORCAD_CHECKOUT = "{source}"
MIMIC_CLI_DIR = "{work}/scripted-clis"

[[step]]
name = "orca-install"
run = ["pnpm", "install", "--frozen-lockfile"]
timeout_minutes = 45

[[step]]
name = "orca-mobile-install"
run = ["pnpm", "-C", "mobile", "install", "--frozen-lockfile"]
timeout_minutes = 45

[[step]]
name = "build-mobile-web"
run = ["pnpm", "run", "build:mobile-web"]
timeout_minutes = 45

[[step]]
name = "build-orcad"
run = ["pnpm", "run", "build:orcad"]
timeout_minutes = 45

# The scripted agent CLIs both sides see (docs/plans mimic decision 5): exec-testkit's `scripted-cli` under the names `claude`, `codex` and `opencode`.
[[step]]
name = "build-scripted-cli"
cwd = "{repo}"
run = ["cargo", "build", "--locked", "--manifest-path", "libraries/agent-api/Cargo.toml", "--target-dir", "{work}/scripted-target", "-p", "exec-testkit", "--bin", "scripted-cli"]
timeout_minutes = 45

[[step]]
name = "scripted-cli-dir"
cwd = "{work}"
run = ["mkdir", "-p", "scripted-clis"]

[[step]]
name = "scripted-cli-claude"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/claude"]

[[step]]
name = "scripted-cli-codex"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/codex"]

[[step]]
name = "scripted-cli-opencode"
cwd = "{work}"
run = ["cp", "scripted-target/debug/scripted-cli", "scripted-clis/opencode"]

# The corpora are derived from the pinned source and the crawl. The scan change that adds rows (docs/plans/rca-parity/pending) cannot be committed ahead of its
# re-record (the gate refuses a stale set), so the record job applies it to its own checkout and derives the corpora again before it records; the landing
# commit holds the same change next to the new cassettes. Remove the first step with the patch.
[[step]]
name = "apply-step5"
cwd = "{repo}"
run = ["git", "apply", "docs/plans/rca-parity/pending/step5-scan-and-corpus.patch"]

[[step]]
name = "refresh-crawl"
cwd = "{repo}"
run = ["wf", "mimic", "crawl", "clis/orca-serve/cassettes/orca-api"]
timeout_minutes = 20

[[step]]
name = "refresh-crawl-corpus"
cwd = "{repo}"
run = ["cp", "clis/orca-serve/cassettes/orca-api/corpus.json", "clis/orca-serve/cassettes/orca-v1.4.259-crawl/corpus.json"]

[[step]]
name = "refresh-recorded-corpus"
cwd = "{repo}"
run = ["node", "tooling/mimic-drivers/src/cli.ts", "corpus", "orca", "clis/orca-serve/cassettes/orca-v1.4.259-recorded"]
timeout_minutes = 20

[[step]]
name = "refresh-scenarios"
cwd = "{repo}"
run = ["node", "tooling/mimic-drivers/src/cli.ts", "scenarios", "orca", "clis/orca-serve/cassettes/orca-v1.4.259-scenarios"]
timeout_minutes = 20
